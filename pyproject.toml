[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulserank"
version = "0.1.0"
description = "Real-time recommendation and experimentation platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vishesh"}]
dependencies = []

[project.optional-dependencies]
# Current Spark/Delta releases require Python 3.10+. The core reference
# pipeline remains compatible with Python 3.9 for a frictionless demo.
distributed = [
  "pyspark==4.1.1; python_version >= '3.10'",
  "delta-spark==4.3.1; python_version >= '3.10'",
]
ml = [
  "numpy==2.4.6; python_version >= '3.11'",
  "mlflow==3.16.1; python_version >= '3.11'",
]

[project.scripts]
pulserank = "pulserank.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pulserank = ["static/*"]
