name: pulserank-streaming

networks:
  pulserank:
    driver: bridge

volumes:
  redpanda-data:

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=0.0.0.0:8081
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "18081:8081"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [pulserank]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 12

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [pulserank]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rpk topic create viewing-events.v1 --brokers redpanda:9092
        --partitions 6 --replicas 1 || true

  console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    networks: [pulserank]

